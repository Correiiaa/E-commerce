  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ===== 2. TOGGLE FAVORITO (ADICIONAR/REMOVER) =====
    async function toggleFavorite(productId) {
      try {
        const data = await safeFetchJson(`${url}/favourites/remove_favorite.php`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ product_id: productId }),
        });

        await fetchAndShowFavorites();

      } catch (error) {
        console.error("Erro ao alternar favorito:", error);
        throw error;
      }
    }

    /* Fetch and show favorites contents */
    async function fetchAndShowFavorites() {
      try {
        const favoritesData = await safeFetchJson(`${url}/favourites/get_favorites.php`, {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
          },
          credentials: "include",
        });
        console.log("Favoritos carregados:", favoritesData);
        renderUserFavorites(favoritesData);
      } catch (error) {
        console.error("Erro ao atualizar carrinho:", error);
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      navbar();
      footer();

      // ✅ Carregar favoritos do utilizador (função global)
      await fetchAndShowFavorites();

      // Carregar encomendas
      await loadUserOrders();
    });

    function showTab(tabName) {
      // Esconder todos os tabs
      document.querySelectorAll(".tab-pane").forEach((pane) => {
        pane.classList.add("d-none");
      });

      // Remover active de todos os botões
      document.querySelectorAll(".nav-link").forEach((link) => {
        link.classList.remove("active");
      });

      // Mostrar tab selecionado
      document.getElementById(`tab-${tabName}`).classList.remove("d-none");

      // Adicionar active ao botão clicado
      event.target.classList.add("active");

      // Carregar dados quando necessário
      if (tabName === 'encomendas') {
        loadUserOrders();
      } else if (tabName === 'favoritos') {
        fetchAndShowFavorites();
      }
    }

    async function loadUserOrders() {
      try {
        const ordersData = await safeFetchJson(`${url}/order/get_user_order.php`, {
          method: "GET",
          credentials: "include",
        });

        const ordersContainer = document.getElementById('orders-container');

        if (!ordersData || ordersData.length === 0) {
          ordersContainer.innerHTML = '<div class="empty-state"><p>Ainda não efetuou nenhuma encomenda</p></div>';
          return;
        }

        let ordersHTML = '';
        ordersData.forEach(order => {
          const statusClass = order.status.toLowerCase();
          const statusText = getOrderStatusText(order.status);

          ordersHTML += `
          <div class="order-card">
            <div class="order-header">
              <span class="order-number">Encomenda #${order.id}</span>
              <span class="order-status ${statusClass}">${statusText}</span>
            </div>
            <p><strong>Data:</strong> ${new Date(order.created_at).toLocaleDateString('pt-PT')}</p>
            <p><strong>Total:</strong> ${parseFloat(order.total_price).toFixed(2)} €</p>
            <p><strong>Morada de Envio:</strong> ${order.shipping_address || 'Não especificada'}</p>
          </div>
        `;
        });

        ordersContainer.innerHTML = ordersHTML;
      } catch (err) {
        console.error('Erro ao carregar encomendas:', err);
        document.getElementById('orders-container').innerHTML =
          '<div class="empty-state"><p>Erro ao carregar encomendas. Faça login primeiro.</p></div>';
      }
    }

    async function renderUserFavorites(favoritesData) {
      try {
        const favoritesContainer = document.getElementById('favorites-container');

        // Usar a variável do fetchandshowfavorites
        if (!favoritesData || favoritesData.length === 0) {
          favoritesContainer.innerHTML = '<div class="empty-state"><p>Ainda não tem produtos favoritos</p></div>';
          return;
        }

        if (favoritesData.length === 0) {
          favoritesContainer.innerHTML = '<div class="empty-state"><p>Ainda não tem produtos favoritos</p></div>';
          return;
        }

        let favoritesHTML = '<div class="row justify-content-center">';
        favoritesData.forEach(product => {
          favoritesHTML += `
          <div class="col-md-3 mb-4 d-flex justify-content-center">
            <div class="product-card position-relative">
              <button class="btn-remove-favorite" onclick="toggleFavorite(${product.id}); event.stopPropagation();">
                <i class="fas fa-trash"></i>
              </button>
              <a href="product.html?id=${product.id}">
                <img src="../static/images/${product.image_url}" alt="${product.name}">
              </a>
              <div class="product-name">${product.name}</div>
              <div class="product-price">${parseFloat(product.price).toFixed(2)} €</div>
              <button class="btn-add-cart add-to-cart-btn" data-product-id="${product.id}">
                <i class="fas fa-shopping-cart me-2"></i>Adicionar ao Carrinho
              </button>
            </div>
          </div>
        `;
        });
        favoritesHTML += '</div>';

        favoritesContainer.innerHTML = favoritesHTML;
      } catch (err) {
        console.error('Erro ao renderizar favoritos:', err);
        document.getElementById('favorites-container').innerHTML =
          '<div class="empty-state"><p>Erro ao carregar favoritos</p></div>';
      }
    }

    function getOrderStatusText(status) {
      const statusMap = {
        'pending': 'Pendente',
        'processing': 'A Processar',
        'shipped': 'Enviado',
        'delivered': 'Entregue',
        'cancelled': 'Cancelado'
      };
      return statusMap[status.toLowerCase()] || status;
    }

    // ===== ADICIONAR AO CARRINHO =====
    document.body.addEventListener("click", async (e) => {
      const addBtn = e.target.closest(".add-to-cart-btn");

      if (addBtn) {
        e.preventDefault();
        const productId = addBtn.dataset.productId;

        if (!productId) {
          console.error("Product ID não encontrado");
          return;
        }

        try {
          await safeFetchJson(`${url}/cart/add_cart.php`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({
              product_id: parseInt(productId, 10),
              quantity: 1,
            }),
          });

          console.log("Produto adicionado ao carrinho");
          await fetchAndShowCart();

        } catch (err) {
          console.error("Erro ao adicionar ao carrinho:", err);
          alert("Erro ao adicionar produto. Faça login primeiro.");
        }
      }
    });

    // ===== CARRINHO LATERAL =====
    document.body.addEventListener("click", async (e) => {
      if (e.target.closest(".cart-botton")) {
        e.preventDefault();
        await fetchAndShowCart();
        return;
      }

      if (e.target.closest(".cart-close")) {
        document.getElementById("cart").classList.remove("cart-open");
        return;
      }
    });

    // ===== REMOVER DO CARRINHO =====
    document.body.addEventListener("click", async (e) => {
      const removeBtn = e.target.closest(".cart-item-remove");
      if (removeBtn) {
        e.preventDefault();
        const productId = removeBtn.dataset.productId;

        try {
          await safeFetchJson(`${url}/cart/remove_from_cart.php`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ product_id: productId }),
          });
          await fetchAndShowCart();
        } catch (err) {
          console.error("Erro ao remover item:", err);
        }
      }
    });

  </script>
