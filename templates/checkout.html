<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../static/style.css" />
    <link rel="stylesheet" href="../static/navbar.css" />
    <link rel="stylesheet" href="../static/cart.css" />
    <link rel="stylesheet" href="../static/body.css" />
    <link rel="stylesheet" href="../static/forms.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <script src="../scripts/script.js"></script>
    <script src="../scripts/navbar.js"></script>

    <style>
        .checkout-container {
            max-width: 800px;
            margin: 120px auto 50px;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .checkout-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            font-weight: 600;
            color: #212121;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-section h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #8b0000;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }

        .form-group label .required {
            color: #8b0000;
            margin-left: 4px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #8b0000;
            box-shadow: 0 0 0 3px rgba(139, 0, 0, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .order-summary {
            background: #f8f8f8;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .order-summary h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .order-item:last-child {
            border-bottom: none;
            font-weight: 600;
            font-size: 1.1rem;
            margin-top: 10px;
            padding-top: 15px;
            border-top: 2px solid #8b0000;
        }

        .btn-submit-order {
            width: 100%;
            padding: 16px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            background-color: #8b0000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-submit-order:hover {
            background-color: #a00000;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 0, 0, 0.3);
        }

        .btn-submit-order:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #d32f2f;
            font-size: 0.9rem;
            margin-top: 10px;
            padding: 10px;
            background-color: #ffebee;
            border-radius: 5px;
            display: none;
        }

        .success-message {
            color: #2e7d32;
            font-size: 0.9rem;
            margin-top: 10px;
            padding: 10px;
            background-color: #e8f5e9;
            border-radius: 5px;
            display: none;
        }

        @media (max-width: 768px) {
            .checkout-container {
                margin: 90px 20px 30px;
                padding: 25px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .checkout-title {
                font-size: 1.5rem;
            }
        }
    </style>

    <title>Finalizar Compra - Toni Correia</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top" id="nav" style="background-color: #212121;"></nav>

    <div class="checkout-container">
        <h1 class="checkout-title">Finalizar Compra</h1>

        <!-- Resumo do Pedido -->
        <div class="order-summary" id="order-summary">
            <h3>Resumo do Pedido</h3>
            <div id="cart-items-summary"></div>
        </div>

        <!-- Formulário de Dados -->
        <form id="checkout-form">
            <div class="form-section">
                <h3>Dados de Contacto</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">
                            Telefone<span class="required">*</span>
                        </label>
                        <input type="tel" id="phone" name="phone" placeholder="+351 912 345 678" required
                            pattern="[+]?[0-9\s]{9,15}" />
                    </div>

                    <div class="form-group">
                        <label for="nif">
                            NIF (opcional)
                        </label>
                        <input type="text" id="nif" name="nif" placeholder="123456789" pattern="[0-9]{9}"
                            maxlength="9" />
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h3>Morada de Envio</h3>

                <div class="form-group">
                    <label for="address">
                        Endereço<span class="required">*</span>
                    </label>
                    <textarea id="address" name="address" placeholder="Rua, número, andar, etc." required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="postal_code">
                            Código Postal<span class="required">*</span>
                        </label>
                        <input type="text" id="postal_code" name="postal_code" placeholder="1234-567" required
                            pattern="[0-9]{4}-[0-9]{3}" maxlength="8" />
                    </div>

                    <div class="form-group">
                        <label for="city">
                            Cidade<span class="required">*</span>
                        </label>
                        <input type="text" id="city" name="city" placeholder="Lisboa" required />
                    </div>
                </div>
            </div>

            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="success-message"></div>

            <button type="submit" class="btn-submit-order" id="submit-btn">
                <i class="fas fa-check-circle me-2"></i>Confirmar Encomenda
            </button>
        </form>
    </div>

    <footer id="footer" class="text-center text-lg-start bg-body-tertiary text-muted"
        style="background-color: #212121 !important">
    </footer>

    <script>
        let cartData = null;

        document.addEventListener("DOMContentLoaded", async () => {
            navbar();
            footer();

            // Carregar dados do carrinho
            try {
                cartData = await safeFetchJson(`${url}/cart/get_user_cart.php`, {
                    method: "GET",
                    credentials: "include",
                });

                if (!cartData || !cartData.items || cartData.items.length === 0) {
                    alert("Seu carrinho está vazio!");
                    window.location.href = "./index.html";
                    return;
                }

                displayCartSummary(cartData);
            } catch (error) {
                console.error("Erro ao carregar carrinho:", error);
                alert("Erro ao carregar dados do carrinho. Faça login primeiro.");
                window.location.href = "./login.html";
            }

            // Auto-formatar código postal
            document.getElementById('postal_code').addEventListener('input', function (e) {
                let value = e.target.value.replace(/[^0-9]/g, '');
                if (value.length > 4) {
                    value = value.slice(0, 4) + '-' + value.slice(4, 7);
                }
                e.target.value = value;
            });

            // Validar NIF
            document.getElementById('nif').addEventListener('input', function (e) {
                e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 9);
            });
        });

        function displayCartSummary(data) {
            const container = document.getElementById('cart-items-summary');
            let html = '';

            data.items.forEach(item => {
                html += `
          <div class="order-item">
            <span>${item.quantity}x ${item.name}</span>
            <span>${(item.price * item.quantity).toFixed(2)} €</span>
          </div>
        `;
            });

            html += `
        <div class="order-item">
          <span>Total</span>
          <span>${data.total.toFixed(2)} €</span>
        </div>
      `;

            container.innerHTML = html;
        }

        document.getElementById('checkout-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            const errorMsg = document.getElementById('error-message');
            const successMsg = document.getElementById('success-message');

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Processando...';

            const phone = document.getElementById('phone').value.trim();
            const nif = document.getElementById('nif').value.trim();
            const address = document.getElementById('address').value.trim();
            const postalCode = document.getElementById('postal_code').value.trim();
            const city = document.getElementById('city').value.trim();

            const shippingAddress = `${address}\n${postalCode} ${city}`;

            try {
                const response = await safeFetchJson(`${url}/order/create_order.php`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({
                        shipping_address: shippingAddress,
                        phone: phone,
                        nif: nif || null,
                        address: address,
                        postal_code: postalCode,
                        city: city
                    }),
                });

                successMsg.textContent = `✅ Encomenda #${response.order_id} criada com sucesso!`;
                successMsg.style.display = 'block';

                setTimeout(() => {
                    window.location.href = `./customer.html`;
                }, 2000);

            } catch (error) {
                console.error("Erro ao criar encomenda:", error);
                errorMsg.textContent = error.message || "Erro ao processar encomenda. Tente novamente.";
                errorMsg.style.display = 'block';

                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-check-circle me-2"></i>Confirmar Encomenda';
            }
        });
    </script>
</body>

</html>
