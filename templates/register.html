<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Registo</title>
</head>
<body>
    <div class="container">
        <div class="left-side">
            <img src="/static/loginimage.jpg" alt="wine login page" class="loginImage">
        </div>

        <div class="righ-side">
            <form action="/register" method="POST" class="form-box">
                    <h2>Registo</h2>
                    <input type="text" id="username" name="user" placeholder="Username" required>
                    <input type="text" id="fname" name="fname" placeholder="First Name" required>
                    <input type="text" id="lname" name="lname" placeholder="Last Name" required>
                    <input type="email" id="email" name="email" placeholder="Email" required>
                    <input type="password" id="password" name="pwd" placeholder="Password" required>
                    <input type="password" id="confirm_password" name="confirm" placeholder="Confirm Password" required>
                    <button type="submit">Registar</button>
                <div class="form-links">
                    <p>Já tem conta? <a href="/login">Faça login aqui</a></p>
                </div>

            </form>

        </div>

    </div>
    
</body>
</html>
