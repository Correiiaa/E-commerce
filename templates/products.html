  <script>

    // VariÃ¡veis globais
    let allProducts = [];
    let filteredProducts = [];
    let currentSort = "default";



    // ===== 1. CARREGAR FAVORITOS DO UTILIZADOR =====
    async function loadUserFavorites() {
      try {
        const favorites = await safeFetchJson(
          `${url}/favourites/get_favorites.php`,
          {
            credentials: "include",
          }
        );

        if (Array.isArray(favorites)) {
          userFavorites = new Set(favorites.map((fav) => fav.id));
        }

        console.log("✅ Favoritos carregados:", Array.from(userFavorites));
      } catch (error) {
        console.error("❌ Erro ao carregar favoritos:", error);
        userFavorites = new Set();
      }
    }

    // ===== 2. TOGGLE FAVORITO (ADICIONAR/REMOVER) =====
    async function toggleFavorite(productId) {
      const isFavorited = userFavorites.has(productId);

      console.log(
        `${isFavorited ? "💔" : "❤️"} Toggle favorito para produto ID:`,
        productId
      );

      try {
        if (isFavorited) {
          // Remover favorito
          await safeFetchJson(`${url}/favourites/remove_favorite.php`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ product_id: parseInt(productId, 10) }),
          });

          userFavorites.delete(productId);
          console.log("💔 Removido dos favoritos:", productId);
        } else {
          // Adicionar favorito
          await safeFetchJson(`${url}/favourites/add_favorite.php`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ product_id: parseInt(productId, 10) }),
          });

          userFavorites.add(productId);
          console.log("❤️ Adicionado aos favoritos:", productId);
        }

        // Atualizar UI do botão específico
        const btn = document.querySelector(
          `.favorite-icon[onclick="toggleFavorite(${productId})"]`
        );
        if (btn) {
          btn.classList.toggle("active", !isFavorited);
        }
      } catch (error) {
        console.error("❌ Erro ao atualizar favorito:", error);

        // Se user não está logado, redirecionar
        if (
          error.message.includes("401") ||
          error.message.includes("Not authenticated")
        ) {
          alert("Faça login para adicionar favoritos!");
          window.location.href = "./login.html";
        }
      }
    }

    // FunÃ§Ã£o para renderizar os produtos (assumindo que recebes da API)
    function renderProducts(products) {
      const grid = document.getElementById("productsGrid");
      const totalProducts = document.getElementById("totalProducts");

      totalProducts.textContent = products.length;

      if (products.length === 0) {
        grid.innerHTML =
          '<div class="col-12 text-center py-5"><h4>Nenhum produto encontrado</h4></div>';
        return;
      }

      grid.innerHTML = products
        .map(
          (product) => `
                <div class="col-lg-4 col-md-6 col-sm-12 mb-4">
                    <div class="product-card">
                        <div class="product-image">
                            <img src="https://esan-tesp-ds-paw.web.ua.pt/tesp-ds-g32/uploads/${product.image_url}" 
                                 alt="${product.name}" class="img-fluid">
                            <button class="favorite-icon ${product.isFavorite ? "active" : ""}" 
                                    onclick="toggleFavorite(${product.id})">
                                <i class="far fa-heart"></i>
                            </button>
                        </div>
                        <div class="product-category">${product.regiao || "REGIÃO"
            }</div>
                        <a href="product.html?id=${product.id}" class="product-name">${product.name}</a>
                        <div class="product-year">${product.ano || "N/A"}</div>
                        <div class="product-price">${product.price}€</div>
                        <button class="add-to-cart add-to-cart-btn" data-product-id="${product.id
            }">
                            <i class="fas fa-shopping-cart me-2"></i>Adicionar ao Carrinho
                        </button>
                    </div>
                </div>
            `
        )
        .join("");
    }

    // FunÃ§Ã£o para ordenar produtos
    function sortProducts(sortType) {
      currentSort = sortType;
      let sortedProducts = [...filteredProducts];

      switch (sortType) {
        case "price_asc":
          sortedProducts.sort((a, b) => a.price - b.price);
          break;
        case "price_desc":
          sortedProducts.sort((a, b) => b.price - a.price);
          break;
        case "name_asc":
          sortedProducts.sort((a, b) => a.name.localeCompare(b.name));
          break;
        case "name_desc":
          sortedProducts.sort((a, b) => b.name.localeCompare(a.name));
          break;
        case "year_desc":
          sortedProducts.sort((a, b) => (b.ano || 0) - (a.ano || 0));
          break;
        case "discount":
          sortedProducts.sort(
            (a, b) => (b.discount || 0) - (a.discount || 0)
          );
          break;
        case "recommended":
          sortedProducts.sort((a, b) => (b.rating || 0) - (a.rating || 0));
          break;
      }

      renderProducts(sortedProducts);
    }

    function normalize(str) {
      return str
        ? str
          .toString()
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
        : "";
    }

    // FunÃ§Ã£o para filtrar produtos
    function applyFilters() {
      const searchTerm = document
        .getElementById("searchInput")
        .value.toLowerCase();
      const minPrice =
        parseFloat(document.getElementById("minPrice").value) || 0;
      const maxPrice =
        parseFloat(document.getElementById("maxPrice").value) || 9999;

      // Obter todos os filtros selecionados
      const selectedTypes = Array.from(
        document.querySelectorAll("#wineTypes input:checked")
      ).map((cb) => cb.value);
      const selectedCapacities = Array.from(
        document.querySelectorAll("#capacity input:checked")
      ).map((cb) => cb.value);
      const selectedCountries = Array.from(
        document.querySelectorAll("#country input:checked")
      ).map((cb) => cb.value);
      const selectedRegions = Array.from(
        document.querySelectorAll("#region input:checked")
      ).map((cb) => cb.value);
      const selectedGrapes = Array.from(
        document.querySelectorAll("#grape input:checked")
      ).map((cb) => cb.value);
      const selectedYears = Array.from(
        document.querySelectorAll("#year input:checked")
      ).map((cb) => cb.value);

      filteredProducts = allProducts.filter((product) => {
        const matchesSearch =
          !searchTerm ||
          normalize(product.name).includes(searchTerm) ||
          normalize(product.regiao).includes(searchTerm);

        const matchesPrice =
          product.price >= minPrice && product.price <= maxPrice;

        const matchesType =
          selectedTypes.length === 0 ||
          selectedTypes.includes(normalize(product.category));
        const matchesCapacity =
          selectedCapacities.length === 0 ||
          selectedCapacities.includes(normalize(product.capacity));
        const matchesCountry =
          selectedCountries.length === 0 ||
          selectedCountries.includes(normalize(product.pais));
        const matchesRegion =
          selectedRegions.length === 0 ||
          selectedRegions.includes(normalize(product.regiao));
        const matchesGrape =
          selectedGrapes.length === 0 ||
          selectedGrapes.includes(normalize(product.grape));
        const matchesYear =
          selectedYears.length === 0 ||
          selectedYears.includes(product.ano?.toString());

        return (
          matchesSearch &&
          matchesPrice &&
          matchesType &&
          matchesCapacity &&
          matchesCountry &&
          matchesRegion &&
          matchesGrape &&
          matchesYear
        );
      });

      sortProducts(currentSort);
    }

    function renderProducts(products) {
      const grid = document.getElementById("productsGrid");
      const totalProducts = document.getElementById("totalProducts");

      totalProducts.textContent = products.length;

      if (products.length === 0) {
        grid.innerHTML = '<div class="col-12 text-center py-5"><h4>Nenhum produto encontrado</h4></div>';
        return;
      }

      grid.innerHTML = products
        .map((product) => {
          // ✅ Verificar se produto está nos favoritos
          const isFavorited = userFavorites.has(product.id);

          return `
                <div class="col-lg-4 col-md-6 col-sm-12 mb-4">
                    <div class="product-card">
                        <div class="product-image">
                            <img src="https://esan-tesp-ds-paw.web.ua.pt/tesp-ds-g32/uploads/${product.image_url}" 
                                 alt="${product.name}" class="img-fluid">
                            <button class="favorite-icon ${isFavorited ? "active" : ""}" 
                                    onclick="toggleFavorite(${product.id})">
                                <i class="far fa-heart"></i>
                            </button>
                        </div>
                        <div class="product-category">${product.regiao || "REGIÃO"}</div>
                        <a href="product.html?id=${product.id}" class="product-name">${product.name}</a>
                        <div class="product-year">${product.ano || "N/A"}</div>
                        <div class="product-price">${product.price}€</div>
                        <button class="add-to-cart add-to-cart-btn" data-product-id="${product.id}">
                            <i class="fas fa-shopping-cart me-2"></i>Adicionar ao Carrinho
                        </button>
                    </div>
                </div>
            `;
        })
        .join("");
    }



    // ========== ATUALIZAR DOMContentLoaded ==========
    document.addEventListener("DOMContentLoaded", async function () {
      navbar();
      footer();
      document.getElementById("loadingIndicator").style.display = "block";

      try {
        // 1. ✅ CARREGAR FAVORITOS PRIMEIRO (se user logado)
        await loadUserFavorites();

        // 2. ✅ DEPOIS CARREGAR PRODUTOS
        const data = await safeFetchJson(`${url}/products/allproducts.php`);
        console.log("✅ Produtos carregados:", data);

        const products = Array.isArray(data) ? data : data.products || [];
        allProducts = products;
        filteredProducts = [...products];

        // 3. ✅ RENDERIZAR COM FAVORITOS JÁ CARREGADOS
        document.getElementById("loadingIndicator").style.display = "none";
        renderProducts(filteredProducts);

      } catch (error) {
        console.error("❌ Erro ao carregar dados:", error);
        document.getElementById("loadingIndicator").innerHTML =
          '<div class="alert alert-danger">Erro ao carregar produtos. Tente novamente.</div>';
      }

      // Search input
      document
        .getElementById("searchInput")
        .addEventListener("input", applyFilters);

      // Price range
      const priceSlider = document.getElementById("priceSlider");
      const priceValue = document.getElementById("priceValue");
      const minPrice = document.getElementById("minPrice");
      const maxPrice = document.getElementById("maxPrice");

      priceSlider.addEventListener("input", function () {
        const value = this.value;
        priceValue.textContent = `5€ - ${value}€`;
        maxPrice.value = value;
        applyFilters();
      });

      minPrice.addEventListener("change", applyFilters);
      maxPrice.addEventListener("change", applyFilters);

      // Todos os checkboxes
      document
        .querySelectorAll('input[type="checkbox"]')
        .forEach((checkbox) => {
          checkbox.addEventListener("change", applyFilters);
        });


    });

    // FunÃ§Ã£o para reset de filtros
    function resetAllFilters() {
      document.getElementById("searchInput").value = "";
      document.getElementById("minPrice").value = "5";
      document.getElementById("maxPrice").value = "500";
      document.getElementById("priceSlider").value = "250";
      document.getElementById("priceValue").textContent = "5€ - 500€";

      document
        .querySelectorAll('input[type="checkbox"]')
        .forEach((checkbox) => {
          checkbox.checked = false;
        });

      filteredProducts = [...allProducts];
      currentSort = "default";
      renderProducts(filteredProducts);
    }


    document.body.addEventListener("click", async (e) => {
      // Abrir carrinho ao clicar no .cart-botton ou seu filho
      if (e.target.closest(".cart-botton")) {
        e.preventDefault();
        try {
          const cartData = await safeFetchJson(
            "https://esan-tesp-ds-paw.web.ua.pt/tesp-ds-g32/E-commerce/api/cart/get_user_cart.php",
            {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
              },
            }
          );
          console.log(cartData);
          showCart(cartData);
        } catch (err) {
          console.error(err);
        }
        return;
      }
      // Fechar carrinho ao clicar no botÃ£o X ou no SVG dentro dele
      if (e.target.closest(".cart-close")) {
        document.getElementById("cart").classList.remove("cart-open");
        return;
      }
    });

    document.body.addEventListener("click", async (e) => {
      if (e.target.classList.contains("add-to-cart-btn")) {
        e.preventDefault();

        const productId = e.target.getAttribute('data-product-id');

        console.log("Adicionar ao carrinho, productId:", productId);

        if (!productId) {
          console.error("Product ID não encontrado no botão");
          return;
        }
        // Enviar pedido POST à API
        try {
          const cartData = await safeFetchJson(`${url}/cart/add_cart.php`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            credentials: "include",
            body: JSON.stringify({
              product_id: parseInt(productId, 10),
              quantity: 1,
            }),
          });
          await fetchAndShowCart();
        } catch (err) {
          console.error(err);
        }
      }
    });


    document.body.addEventListener("click", async (e) => {
      const removeBtn = e.target.closest(".cart-item-remove");
      if (removeBtn) {
        e.preventDefault();
        const productId = removeBtn.dataset.productId;
        console.log("Remover produto ID:", productId);
        try {
          await safeFetchJson(
            "https://esan-tesp-ds-paw.web.ua.pt/tesp-ds-g32/E-commerce/api/cart/remove_from_cart.php",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({ product_id: productId }),
            }
          );
          await fetchAndShowCart();
        } catch (err) {
          console.error("Erro a remover item do carrinho:", err);
        }
      }
    });

  </script>
</body>
