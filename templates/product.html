                  transform="translate(-1860 -34) translate(1860 34)"></path>

  <div class="product-page">
    <div class="containersection" id="product-section">
      <!-- <div class="section-header">
                <a class="product-section" href="/products"><p>{{ product.category }}</p></a>
                <ul class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a href="/">Home</a>

                    </li>

            </div> -->
      <div class="row mb-4">
        <div class="col-12">
          <h1 class="display-4 fw-bold mb-2">Vinhos</h1>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item">
                <a href="./index.html" class="text-decoration-none">Home</a>
              </li>

                Vinhos
              </li>
            </ol>
          </nav>
          <div class="free-shipping">
            <i class="fas fa-truck me-2"></i>Portes grátis a partir de 50€
          </div>
        </div>
      </div>
      <div class="product-details">
        <div class="product-image">

          <p class="product-name" id="product-name"></p>

              </button>

              <!-- Quantity Controls -->
              <div class="quantity-button-wrapper d-flex align-items-center">
                <button type="button" class="quantity-button quantity-buttons-less">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 15 15">
                    <g fill="none" fill-rule="evenodd">
                      <g fill="#222">
                        <path
                          d="M2.636 2.633c-.223.224-.223.586 0 .81l8.904 8.902c.223.224.585.224.808 0 .224-.223.224-.585 0-.809L3.445 2.633c-.223-.223-.585-.223-.809 0z"
                          transform="rotate(-45 7.492 7.49)"></path>
                      </g>
                    </g>
                  </svg>
                </button>
                <input type="text" name="Quantity" value="1" class="quantity-buttons-input" readonly />
                <button type="button" class="quantity-button quantity-buttons-more">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 15 15">
                    <g fill="none" fill-rule="evenodd">
                      <g fill="#222">
                        <path
                          d="M12.35 2.637c-.223-.223-.586-.223-.809 0L7.496 6.682 3.451 2.637c-.223-.223-.585-.223-.809 0-.223.223-.223.586 0 .809L6.687 7.49l-4.06 4.06c-.223.223-.223.585 0 .809.224.223.586.223.809 0l4.06-4.06 4.05 4.049c.223.223.585.223.808 0 .224-.223.224-.586 0-.809L8.305 7.49l4.045-4.044c.223-.223.223-.586 0-.809z"
                          transform="rotate(-45 7.49 7.498)"></path>
                      </g>
                    </g>
                  </svg>
                </button>
              </div>

              <!-- Botão Adicionar ao Carrinho -->
              <button class="btn btn-dark add-to-cart-btn big flex-grow-1" id="add-to-cart-btn" data-product-id="">

          <div class="product-spects">

                    <img src="../static/icons/anovinho.jpg" alt="" />

                    <span>Ano</span>
                    <p id="ano"></p>

                <div class="product-detail-spects">
                  <div class="product-detail-spects-icon">
                    <img src="../static/icons/teoralcool.jpg" alt="Alcool" />
                  </div>
                  <div class="product-detail-spects-text">
                    <span>Teor alcoólico</span>
                    <p id="volumeal"></p>

              </div>
              <div class="col-12 col-lg-6">
                <div class="product-detail-spects">
                  <div class="product-detail-spects-icon">
                    <img src="../static/icons/contry-icon.png" alt="Pais de origem" />
                  </div>
                  <div class="product-detail-spects-text">
                    <span>Pai­s</span>
                    <p id="pais"></p>
                  </div>
                </div>
                <div class="product-detail-spects">
                  <div class="product-detail-spects-icon">
                    <img src="../static/icons/produtor.jpg" alt="Produtor" />
                  </div>
                  <div class="product-detail-spects-text">
                    <span>Produtor</span>
                    <p id="produtor"></p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <h2 class="section-subtitle highlight-products-subtitle">
      Produtos Recomendados
    </h2>
    <p class="section-title highlight-products-title"></p>
  </div>

  <div class="carousel-wrapper">
    <button class="carousel-btn prev">
      <i class="fas fa-chevron-left"></i>
    </button>
    <div class="carousel-viewport">
      <div class="carousel-track" id="product-container">
        <!-- Cards serão adicionados AQUI pelo JavaScript -->
      </div>
    </div>
    <button class="carousel-btn next">
      <i class="fas fa-chevron-right"></i>
    </button>
  </div>

  <!-- Footer -->
  <footer id="footer" class="text-center text-lg-start bg-body-tertiary text-muted"
    style="background-color: #212121 !important">
  </footer>
  <!-- Footer -->


  <script src="../scripts/script.js"></script>
  <script src="../scripts/navbar.js"></script>

  <script>
    var product = {};
    let currentQuantity = 1;
    let userFavorites = new Set();


    // ===== 1. CARREGAR FAVORITOS DO UTILIZADOR =====
    async function loadUserFavorites() {
      try {
        const favorites = await safeFetchJson(
          `${url}/favourites/get_favorites.php`,
          {
            credentials: "include",
          }
        );

        if (Array.isArray(favorites)) {
          userFavorites = new Set(favorites.map((fav) => fav.id));
        }

        console.log("✅ Favoritos carregados:", Array.from(userFavorites));
      } catch (error) {
        console.error("❌ Erro ao carregar favoritos:", error);
        userFavorites = new Set();
      }
    }

    // ===== 2. TOGGLE FAVORITO (ADICIONAR/REMOVER) =====
    async function toggleFavorite(productId) {
      const isFavorited = userFavorites.has(productId);

      console.log(
        `${isFavorited ? "💔" : "❤️"} Toggle favorito para produto ID:`,
        productId
      );

      try {
        if (isFavorited) {
          // Remover favorito
          await safeFetchJson(`${url}/favourites/remove_favorite.php`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ product_id: parseInt(productId, 10) }),
          });

          userFavorites.delete(productId);
          console.log("💔 Removido dos favoritos:", productId);
        } else {
          // Adicionar favorito
          await safeFetchJson(`${url}/favourites/add_favorite.php`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ product_id: parseInt(productId, 10) }),
          });

          userFavorites.add(productId);
          console.log("❤️ Adicionado aos favoritos:", productId);
        }

        // Atualizar UI do botão específico
        const btn = document.querySelector(
          `.favorite-icon[onclick="toggleFavorite(${productId})"]`
        );
        if (btn) {
          btn.classList.toggle("active", !isFavorited);
        }
      } catch (error) {
        console.error("❌ Erro ao atualizar favorito:", error);

        // Se user não está logado, redirecionar
        if (
          error.message.includes("401") ||
          error.message.includes("Not authenticated")
        ) {
          alert("Faça login para adicionar favoritos!");
          window.location.href = "./login.html";
        }
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      navbar();
      footer();

      // ===== 1. CARREGAR FAVORITOS DO UTILIZADOR =====
      await loadUserFavorites();

      // ===== 2. CARREGAR PRODUTO PRINCIPAL =====
      let id = new URLSearchParams(location.search).get("id");
      if (!id) {
        const parts = location.pathname.split("/").filter(Boolean);
        id = parts[parts.length - 1] || "";
      }
      id = Number(id);

      if (!id) {
        console.error("❌ Invalid product id");
        return;
      }

      const productUrl = `${url}/products/get_products_by_id.php?id=${encodeURIComponent(id)}`;
      console.log("🔍 Fetching product:", productUrl);

      try {
        product = await safeFetchJson(productUrl, { method: "GET" });
        console.log("✅ Product loaded:", product);

        // Preencher informações do produto
        document.getElementById("product-image").src = `${url.replace("/api", "")}/static/images/${product.image_url}`;
        document.getElementById("product-name").textContent = product.name;
        document.getElementById("add-to-cart-btn").setAttribute("data-product-id", product.id);
        document.getElementById("favorite-btn").setAttribute("data-product-id", product.id);
        document.getElementById("product-id").textContent = "ID: " + product.id;
        document.getElementById("product-price").textContent = product.price + " €";
        document.getElementById("regiao").textContent = product.regiao || "—";
        document.getElementById("ano").textContent = product.ano || "—";
        document.getElementById("volumeal").textContent = product.volumeal || "—";
        document.getElementById("pais").textContent = product.pais || "—";
        document.getElementById("produtor").textContent = product.produtor || "—";

        if (document.getElementById("descricao")) {
          document.getElementById("descricao").textContent = product.descricao || "";
        }

        // ✅ Atualizar estado do botão de favoritos
        updateFavoriteButtonState(product.id);

      } catch (e) {
        console.error("❌ Failed to fetch product data:", e);
        return;
      }

      // ===== 3. CARREGAR PRODUTOS RECOMENDADOS =====
      const section = product.category_id;
      try {
        const productsUrl = `${url}/products/get_products_section.php?section=${encodeURIComponent(section)}`;
        const products = await safeFetchJson(productsUrl, { method: "GET", credentials: "include" });

        if (!Array.isArray(products) || products.length === 0) {
          console.warn("⚠️ Nenhum produto recomendado encontrado");
          return;
        }

        const container = document.getElementById("product-container");
        container.innerHTML = "";

        products.forEach((prod) => {
          let extraClass = "";
          if (prod.name === "Encosta d´Aregos") extraClass = " encosta-daregos";
          else if (prod.name === "M&M ROSÉ") extraClass = " MM-rose";
          else if (prod.name === "Perspetiva Colheita Branco") extraClass = " perspetiva-colheita-branco";

          // ✅ Verificar se produto está nos favoritos
          const isFavorited = userFavorites.has(prod.id);
          const heartClass = isFavorited ? "fas" : "far";
          const activeClass = isFavorited ? "active" : "";

          const card = document.createElement("div");
          card.classList.add("card", "h-100");
          card.innerHTML = `
        <img class="card-img-top${extraClass}" src="../static/images/${prod.image_url}" alt="${prod.name}">
        <div class="card-body text-center">
          <h5 class="card-title">${prod.name}</h5>
          <p class="card-text">${Number(prod.price).toFixed(2)} €</p>
          <a href="product.html?id=${prod.id}" class="btn btn-light">Ver detalhes</a>
          <button class="btn btn-dark add-to-cart-btn" data-product-id="${prod.id}">
            <i class="fas fa-shopping-cart"></i>
          </button>
        </div>
      `;
          container.appendChild(card);
        });

        // Carousel logic
        const track = document.querySelector(".carousel-track");
        const cards = track.querySelectorAll(".card");
        if (cards.length === 0) return;

        const prevBtn = document.querySelector(".carousel-btn.prev");
        const nextBtn = document.querySelector(".carousel-btn.next");
        const visibleCards = 3;
        let currentIndex = 0;

        const updateCarousel = () => {
          const cardWidth = cards[0].offsetWidth + 20;
          const offset = currentIndex * cardWidth;
          track.style.transform = `translateX(-${offset}px)`;

          cards.forEach((card, index) => {
            card.classList.remove("fade");
            if (index < currentIndex || index >= currentIndex + visibleCards) {
              card.classList.add("fade");
            }
          });
        };

        prevBtn.addEventListener("click", () => {
          if (currentIndex > 0) {
            currentIndex--;
            updateCarousel();
          }
        });

        nextBtn.addEventListener("click", () => {
          if (currentIndex < cards.length - visibleCards) {
            currentIndex++;
            updateCarousel();
          }
        });

        updateCarousel();
      } catch (error) {
        console.error("❌ Erro ao buscar produtos recomendados:", error);
      }
    });

    // ===== 4. ATUALIZAR ESTADO VISUAL DO BOTÃO DE FAVORITOS =====
    function updateFavoriteButtonState(productId) {
      const btn = document.getElementById("favorite-btn");
      const icon = document.getElementById("heart-icon");

      if (!btn || !icon) return;

      const isFavorited = userFavorites.has(productId);

      if (isFavorited) {
        btn.classList.add("active");
        icon.classList.remove("far");
        icon.classList.add("fas");
      } else {
        btn.classList.remove("active");
        icon.classList.remove("fas");
        icon.classList.add("far");
      }
    }

    // ===== 5. QUANTITY CONTROLS =====
    document.body.addEventListener("click", (e) => {
      const quantityInput = document.querySelector(".quantity-buttons-input");

      if (e.target.closest(".quantity-buttons-less")) {
        if (currentQuantity > 1) {
          currentQuantity--;
          quantityInput.value = currentQuantity;
        }
      }

      if (e.target.closest(".quantity-buttons-more")) {
        if (currentQuantity < product.quantity) {
          currentQuantity++;
          quantityInput.value = currentQuantity;
        } else {
          alert(`Stock máximo: ${product.quantity} unidades`);
        }
      }
    });

    // ===== 6. ADICIONAR AO CARRINHO (com quantidade) =====
    document.body.addEventListener("click", async (e) => {
      const addBtn = e.target.closest(".add-to-cart-btn");

      if (addBtn) {
        e.preventDefault();
        const productId = addBtn.dataset.productId;

        if (!productId) {
          console.error("Product ID não encontrado");
          return;
        }

        // Se for o botão principal da página, usa a quantidade selecionada
        const quantity = addBtn.id === "add-to-cart-btn" ? currentQuantity : 1;

        try {
          await safeFetchJson(`${url}/cart/add_cart.php`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({
              product_id: parseInt(productId, 10),
              quantity: quantity,
            }),
          });

          console.log(`✅ ${quantity}x produto(s) adicionado(s) ao carrinho`);
          await fetchAndShowCart();

        } catch (err) {
          console.error("❌ Erro ao adicionar ao carrinho:", err);
          alert("Erro ao adicionar produto. Faça login primeiro.");
        }
      }
    });

    // ===== 7. FAVORITOS (usando função global toggleFavorite) =====
    document.body.addEventListener("click", async (e) => {
      if (e.target.closest("#favorite-btn")) {
        e.preventDefault();
        const btn = e.target.closest("#favorite-btn");
        const productId = parseInt(btn.dataset.productId, 10);

        // ✅ Usar função global do script.js
        await toggleFavorite(productId);

        // ✅ Atualizar estado visual
        updateFavoriteButtonState(productId);
      }
    });

    // ===== 8. CARRINHO LATERAL =====
    document.body.addEventListener("click", async (e) => {
      if (e.target.closest(".cart-botton")) {
        e.preventDefault();
        await fetchAndShowCart();
        return;
      }

      if (e.target.closest(".cart-close")) {
        document.getElementById("cart").classList.remove("cart-open");
        return;
      }
    });

    // ===== 9. REMOVER DO CARRINHO =====
    document.body.addEventListener("click", async (e) => {
      if (e.target.classList.contains("cart-item-remove")) {
        e.preventDefault();
        const productId = e.target.dataset.productId;

        await safeFetchJson(`${url}/cart/remove_from_cart.php`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ product_id: productId }),
        });

        await fetchAndShowCart();
      }
    });

    // ===== 10. EFEITO DE SCROLL NO NAVBAR =====
    var nav = document.getElementById("nav");
    window.addEventListener("scroll", function () {
      nav.style.background = window.pageYOffset > 100 ? "#212121" : "transparent";
    });
  </script>
</body>

</html>
