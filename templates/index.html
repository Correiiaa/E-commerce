<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <title>Index</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top" id="nav">
        <div class="container">
            <a class="navbar-brand" href="#">Toni Correia</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item active">
                        <a class="nav-link" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Sobre nós</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/products">Vinhos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Bar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img class="d-block w-100" src="/static/pexels-craytive-1545529.jpg" alt="First slide">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Um prazer servi-los</h5>
                    <p></p>
                </div>
            </div>
            <div class="carousel-item">
                <img class="d-block w-100" src="/static/photo-1563514227147-6d2ff665a6a0.jpg" alt="Second slide">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Qualidade e compromisso</h5>
                    <p></p>
                </div>
            </div>
            <div class="carousel-item">
                <img class="d-block w-100" src="/static/pexels-remi-boussicaut-109289-338347.jpg" alt="Third slide">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Toni Correia</h5>
                    <p>Distribuição</p>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    {% if user %}
    <form method="post" action="/logout">
        <button type="submit" >Sair</button>
    </form>
    {% else %}
    Login
    {% endif %}

<div class="container">
    <h2 class="section-subtitle highlight-products-subtitle">Produtos Recomendados</h2>
    <p class="section-title highlight-products-title"></p>
</div>

<div class="container-fluid"
id="product-container"></div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        fetch('/products')  // <- A rota correta da API
            .then(response => response.json())
            .then(products => {
                const container = document.getElementById('product-container');
                products.forEach(product => {
                    let extraClass = '';
                    console.log(`Produto: ${product.name}`);
                    if (product.name === "Encosta d´Aregos")  {
                        extraClass= ' encosta-daregos';
                    } else if( product.name === "M&M ROSÉ") {
                        extraClass = ' MM-rose'
                    }
                    const card = `
                        <div class="col-md-3 col-sm-6 m-3 p-0">
                            <div class="card h-100">
                                <img class="card-img-top${extraClass}" src="/static/images/${product.image_url}" alt="${product.name}">
                                <div class="card-body text-center">
                                    <h5 class="card-title">${product.name}</h5>
                                    <p class="card-text">${Number(product.price).toFixed(2)} €</p>
                                    <a href="/products/${product.id}" class="btn btn-light">Ver detalhes</a>
                                    <a href="/cart/add?product_id=${product.id}" class="btn btn-dark">Adicionar</a>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            })
            .catch(error => {
                console.error('Erro ao buscar produtos:', error);
            });
    });

    var nav = document.getElementById('nav');
        window.addEventListener("scroll", function(event) {
            if(window.pageYOffset>100){

                nav.style.background = "#212121";

            }
            else{
                nav.style.background = "transparent";
            }
        });
</script>
</body>

</html>
