<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/index.css">
    <title>Index</title>
</head>

<script>

    function showPopup() {
        document.getElementById("popup").style.display = "flex";
    }

    function closePopup() {
      document.getElementById('popup').style.display = 'none';
    }

</script>
<body {% if show_popup %}onload="showPopup()" {% endif %}>
    <div class="header">
        <div class="logo">
        </div>
        <div class="headerlinks">
            <nav>
                <a href="/">Home</a>
                <a href="/products">Products</a>
                <a href="/cart">Cart</a>
                <a href="/orders">Orders</a>
                <a href="/profile">Profile</a>
                <a href="/about">About</a>
                <a href="/contact">Contact</a>
                <a href="/login">Inicie Sessão</a>
            </nav>
        </div>
    </div>

    <div class="popup-overlay" id="popup">
        <div class="popup-content">
            <div action="/popup">
                <h2>Permissão</h2>
                <button class="truebutton" name="confirm" onclick="window.location.href='/register/google/authorized'">Yes</button>
            </div>
        </div>
    </div>


    <form method="post" action="/logout">
        <button type="submit" >Sair</button>
    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if not user %}
    <!-- <script>
        showPopup()
    </script>     -->
        <!-- <button type="button" onclick="window.location.href='/register/google/authorized'">
            Entrar com Google
        </button> -->
    {% else %}
        <p>Bem-vindo, {{ user }}!</p>
    {% endif %}

    {% if user %}Olá, {{ user }}{% endif %}

</body>
</html>
