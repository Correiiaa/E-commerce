    }

    .menu-user-wrap.show {

    .menu-user-wrap-no-user {

      right: 10%;

    <div class="carousel-inner">
      <div class="carousel-item active">
        <img class="d-block w-100" src="../static/pexels-craytive-1545529.jpg" alt="First slide" />
        <div class="carousel-caption d-none d-md-block">
          <h5>Um prazer servi-los</h5>

      </div>
      <div class="carousel-item">
        <img class="d-block w-100" src="../static/photo-1563514227147-6d2ff665a6a0.jpg" alt="Second slide" />

  <div class="container">
    <h2 class="section-subtitle highlight-products-subtitle">
      Produtos Recomendados
    </h2>
    <p class="section-title highlight-products-title"></p>
  </div>

  <div class="carousel-wrapper">
    <button class="carousel-btn prev">
      <i class="fas fa-chevron-left"></i>
    </button>
    <div class="carousel-viewport">
      <div class="carousel-track" id="product-container">
        <!-- ✅ Cards serão adicionados AQUI pelo JavaScript -->
      </div>
    </div>
    <button class="carousel-btn next">
      <i class="fas fa-chevron-right"></i>
    </button>
  </div>

  <div class="container">
    <h2 class="section-subtitle highlight-products-subtitle">
      Produtos Populares
    </h2>
    <p class="section-title highlight-products-title"></p>
  </div>

  <div class="carousel-wrapper">
    <button class="carousel-btn prev">
      <i class="fas fa-chevron-left"></i>
    </button>
    <div class="carousel-viewport">
      <div class="carousel-track" id="product-container-bestseller">
        <!-- ✅ Cards serão adicionados AQUI pelo JavaScript -->
      </div>
    </div>
    <button class="carousel-btn next">
      <i class="fas fa-chevron-right"></i>
    </button>

  <!-- Footer -->
  <footer id="footer" class="text-center text-lg-start bg-body-tertiary text-muted"
    style="background-color: #212121 !important">
  </footer>
  <!-- Footer -->

  <script>

    document.addEventListener("DOMContentLoaded", () => {
      navbar();
      footer();
      safeFetchJson(`${url}/products/allproducts.php`)
        .then((data) => {
          // normaliza: o endpoint devolve { products: [...], count: N }
          const products = Array.isArray(data) ? data : data.products || [];
          const container = document.getElementById("product-container");
          products.forEach((product) => {
            console.log(product.name);
            let extraClass = "";
            if (product.name === "Encosta d´Aregos") {
              extraClass = " encosta-daregos";
            } else if (product.name === "M&M ROSÉ") {
              extraClass = " MM-rose";
            } else if (product.name === "Perspetiva Colheita Branco") {
              extraClass = " perspetiva-colheita-branco";
            } else if (
              product.name === "Vinho Teste 1" ||
              product.name === "Vinho Teste 2"
            ) {
              extraClass = " vinho-teste";
            }

            const card = document.createElement("div");
            card.classList.add("card", "h-100");
            card.innerHTML = `
                    <img class="card-img-top${extraClass}" src="/tesp-ds-g32/E-commerce/static/images/${product.image_url
              }" alt="${product.name}">
                    <div class="card-body text-center">
                        <h5 class="card-title">${product.name}</h5>
                        <p class="card-text">${Number(product.price).toFixed(
                2
              )} €</p>
                        <a href="product.html?id=${product.id
              }" class="btn btn-light">Ver detalhes</a>
                        <a class="btn btn-dark a add-to-cart-btn" data-product-id="${product.id
              }">Cart</a>
                    </div>
                `;
            container.appendChild(card);
          });

          // Carousel logic
          const track = document.querySelector(".carousel-track");
          const cards = track.querySelectorAll(".card");
          const prevBtn = document.querySelector(".carousel-btn.prev");
          const nextBtn = document.querySelector(".carousel-btn.next");
          const visibleCards = 3;
          let currentIndex = 0;

          const updateCarousel = () => {
            const cardWidth = cards[0].offsetWidth + 20; // 20px gap
            const offset = currentIndex * cardWidth;
            track.style.transform = `translateX(-${offset}px)`;

            cards.forEach((card, index) => {
              card.classList.remove("fade");
              if (
                index < currentIndex ||
                index >= currentIndex + visibleCards
              ) {
                card.classList.add("fade");
              }
            });
          };

          prevBtn.addEventListener("click", () => {
            if (currentIndex > 0) {
              currentIndex--;
              updateCarousel();
            }
          });

          nextBtn.addEventListener("click", () => {
            if (currentIndex < cards.length - visibleCards) {
              currentIndex++;
              updateCarousel();
            }
          });

          // Inicializar com fade correto
          updateCarousel();
        })
        .catch((error) => {
          console.error("Erro ao buscar produtos:", error);
        });
    });

    var nav = document.getElementById("nav");
    window.addEventListener("scroll", function () {
      nav.style.background =
        window.pageYOffset > 100 ? "#212121" : "transparent";
    });

    document.body.addEventListener("click", async (e) => {
      // Abrir carrinho ao clicar no .cart-botton ou seu filho
      if (e.target.closest(".cart-botton")) {
        e.preventDefault();
        try {
          const cartData = await safeFetchJson(
            `${url}/cart/get_user_cart.php`,
            {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
              },
              credentials: "include",
            }
          );
          console.log(cartData);
          showCart(cartData);
        } catch (err) {
          console.error(err);
        }
        return;
      }
      // Fechar carrinho ao clicar no botão X ou no SVG dentro dele
      if (e.target.closest(".cart-close")) {
        document.getElementById("cart").classList.remove("cart-open");
        return;
      }
    });

    document.body.addEventListener("click", async (e) => {
      if (e.target.classList.contains("add-to-cart-btn")) {
        e.preventDefault();

        const productId = e.target.dataset.productId;

        // Enviar pedido POST à API
        try {
          const cartData = await safeFetchJson(`${url}/cart/add_cart.php`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            credentials: "include",
            body: JSON.stringify({ product_id: productId, quantity: 1 }),
          });
          await fetchAndShowCart();
        } catch (err) {
          console.error(err);
        }
      }
    });

    document.body.addEventListener("click", async (e) => {
      const removeBtn = e.target.closest(".cart-item-remove");
      if (removeBtn) {
        e.preventDefault();
        const productId = removeBtn.dataset.productId;
        try {
          await safeFetchJson(`${url}/cart/remove_from_cart.php`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ product_id: productId }),
          });
          await fetchAndShowCart();
        } catch (err) {
          console.error("Erro ao remover item:", err);
        }
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      safeFetchJson(`${url}/products/best_seller.php`)
        .then((data) => {
          console.log(data);
          // normaliza: o endpoint devolve { products: [...], count: N }
          const products = Array.isArray(data) ? data : data.products || [];

            "product-container-bestseller"
          );
          products.forEach((product) => {
            console.log(product.name);
            let extraClass = "";
            if (product.name === "Encosta d´Aregos") {
              extraClass = " encosta-daregos";
            } else if (product.name === "M&M ROSÉ") {
              extraClass = " MM-rose";
            } else if (product.name === "Perspetiva Colheita Branco") {
              extraClass = " perspetiva-colheita-branco";
            } else if (
              product.name === "Vinho Teste 1" ||
              product.name === "Vinho Teste 2"
            ) {
              extraClass = " vinho-teste";
            }

            const card = document.createElement("div");
            card.classList.add("card", "h-100");
            card.innerHTML = `
                    <img class="card-img-top${extraClass}" src="/tesp-ds-g32/E-commerce/static/images/${product.image_url
              }" alt="${product.name}">
                    <div class="card-body text-center">
                        <h5 class="card-title">${product.name}</h5>
                        <p class="card-text">${Number(product.price).toFixed(
                2
              )} €</p>
                        <a href="product.html?id=${product.id
              }" class="btn btn-light">Ver detalhes</a>
                        <a class="btn btn-dark a add-to-cart-btn" data-product-id="${product.id
              }">Cart</a>
                    </div>
                `;
            container.appendChild(card);
          });

          // Carousel logic
          const track = document.querySelector(".carousel-track");
          const cards = track.querySelectorAll(".card");
          const prevBtn = document.querySelector(".carousel-btn.prev");
          const nextBtn = document.querySelector(".carousel-btn.next");
          const visibleCards = 3;
          let currentIndex = 0;

          const updateCarousel = () => {
            const cardWidth = cards[0].offsetWidth + 20; // 20px gap
            const offset = currentIndex * cardWidth;
            track.style.transform = `translateX(-${offset}px)`;

            cards.forEach((card, index) => {
              card.classList.remove("fade");
              if (
                index < currentIndex ||
                index >= currentIndex + visibleCards
              ) {
                card.classList.add("fade");
              }
            });
          };

          prevBtn.addEventListener("click", () => {
            if (currentIndex > 0) {
              currentIndex--;
              updateCarousel();
            }
          });

          nextBtn.addEventListener("click", () => {
            if (currentIndex < cards.length - visibleCards) {
              currentIndex++;
              updateCarousel();
            }
          });

          // Inicializar com fade correto
          updateCarousel();
        })
        .catch((error) => {
          console.error("Erro ao buscar produtos:", error);
        });
    });

  </script>
</body>

</html>
