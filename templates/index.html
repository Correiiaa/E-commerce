<!DOCTYPE html>
<html lang="pt">
<head>

    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>

                    <li class="nav-item">

            <div class="cart-botton" id="cart-button">

            <div class="search">

    <div id="cart" class="mt-4" style="display: none;"></div>

    <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">

            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img class="d-block w-100" src="/static/pexels-craytive-1545529.jpg" alt="First slide">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Um prazer servi-los</h5>
                    <p></p>
                </div>
            </div>
            <div class="carousel-item">
                <img class="d-block w-100" src="/static/photo-1563514227147-6d2ff665a6a0.jpg" alt="Second slide">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Qualidade e compromisso</h5>
                    <p></p>
                </div>
            </div>
            <div class="carousel-item">
                <img class="d-block w-100" src="/static/pexels-remi-boussicaut-109289-338347.jpg" alt="Third slide">

            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    {% if user %}
    <form method="post" action="/logout">
        <button type="submit" >Sair</button>
    </form>
    {% else %}
    Login
    {% endif %}

    <div class="container">
        <h2 class="section-subtitle highlight-products-subtitle">Produtos Recomendados</h2>
        <p class="section-title highlight-products-title"></p>
    </div>

    <div class="carousel-wrapper">
        <button class="carousel-btn prev">‹</button>
        <div class="carousel-viewport">
            <div class="carousel-track" id="product-container"></div>
        </div>
        <button class="carousel-btn next">›</button>
    </div>


<script>
document.addEventListener("DOMContentLoaded", () => {
    fetch('/products')
        .then(response => response.json())
        .then(products => {
            const container = document.getElementById('product-container');
            products.forEach(product => {
                console.log(product.name);
                let extraClass = '';
                if (product.name === "Encosta d´Aregos") {
                    extraClass = ' encosta-daregos';
                } else if (product.name === "M&M ROSÉ") {
                    extraClass = ' MM-rose';
                } else if (product.name === "Perspetiva Colheita Branco"){
                    extraClass = ' perspetiva-colheita-branco';
                }
                

                const card = document.createElement("div");
                card.classList.add("card", "h-100");
                card.innerHTML = `
                    <img class="card-img-top${extraClass}" src="/static/images/${product.image_url}" alt="${product.name}">
                    <div class="card-body text-center">
                        <h5 class="card-title">${product.name}</h5>
                        <p class="card-text">${Number(product.price).toFixed(2)} €</p>
                        <a href="/products/${product.id}" class="btn btn-light">Ver detalhes</a>
                        <a class="btn btn-dark add-to-cart-btn" data-product-id="${product.id}">Adicionar</a>
                    </div>
                `;
                container.appendChild(card);
            });

            // Carousel logic
            const track = document.querySelector('.carousel-track');
            const cards = track.querySelectorAll('.card');
            const prevBtn = document.querySelector('.carousel-btn.prev');
            const nextBtn = document.querySelector('.carousel-btn.next');
            const visibleCards = 3;
            let currentIndex = 0;

            const updateCarousel = () => {
                const cardWidth = cards[0].offsetWidth + 20; // 20px gap
                const offset = currentIndex * cardWidth;
                track.style.transform = `translateX(-${offset}px)`;

                cards.forEach((card, index) => {
                    card.classList.remove('fade');
                    if (
                        index < currentIndex ||
                        index >= currentIndex + visibleCards
                    ) {
                        card.classList.add('fade');
                    }
                });
            };

            prevBtn.addEventListener('click', () => {
                if (currentIndex > 0) {
                    currentIndex--;
                    updateCarousel();
                }
            });

            nextBtn.addEventListener('click', () => {
                if (currentIndex < cards.length - visibleCards) {
                    currentIndex++;
                    updateCarousel();
                }
            });

            // Inicializar com fade correto
            updateCarousel();
        })
        .catch(error => {
            console.error('Erro ao buscar produtos:', error);
        });

    var nav = document.getElementById('nav');
    window.addEventListener("scroll", function () {
        nav.style.background = window.pageYOffset > 100 ? "#212121" : "transparent";
    });

    document.body.addEventListener('click', async (e) => {
    if (e.target.classList.contains('add-to-cart-btn')) {
      e.preventDefault();

      const productId = e.target.dataset.productId;

      // Enviar pedido POST à API
      try {
        const response = await fetch('/cart/add', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ product_id: productId, quantity: 1 })
        });

        if (!response.ok) {
          throw new Error("Erro ao adicionar ao carrinho");
        }

        let cartData;
        try {
            cartData = await response.json();
        } catch (e) {
            console.error("Erro a fazer parse do JSON:", e);
            const text = await response.text();
            console.log("Resposta crua:", text);
        return;
        }
        console.log(cartData);

        // Mostrar carrinho numa div
        const cartDiv = document.getElementById("cart");
        cartDiv.style.display = 'block';
        cartDiv.innerHTML = `
          <h2>Carrinho</h2>
            <div class="cart-items">
                ${cartData.items.map(item => `
                    <div class="cart-item">
                        <div class="item-image">
                            <img src="/static/images/${item.image_url}" alt="${item.name}">
                        </div>
                        <p>${item.name}</p>
                        <p>Quantidade: ${item.quantity}</p>
                        <p>Preço: ${item.price}€</p>
                    </div>
                `).join('')}
            </div>
            <div class="total-price">${cartData.total.toFixed(2)}€</div>
        `;
        
      } catch (err) {
        alert("Erro ao adicionar ao carrinho!");
        console.error(err);
      }
    }
  });

    document.querySelector('.cart-botton').addEventListener('click', function() {
            const cartDiv = document.getElementById('cart');
            cartDiv.style.display = 'block';
            cartDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
});
</script>


</body>

</html>
