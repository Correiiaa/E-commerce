    <script>
      async function safeFetchJson(url, opts = {}) {
        const res = await fetch(url, opts);
        const text = await res.text();
        if (!res.ok) {
          console.error(`Fetch ${url} falhou (status ${res.status}):`, text);
          throw new Error(`Fetch failed: ${res.status}`);
        }
        const ct = res.headers.get("content-type") || "";
        if (ct.includes("application/json")) {
          try {
            return JSON.parse(text);
          } catch (e) {
            console.error(
              "Falha ao parsear JSON com content-type application/json:",
              e,
              text.slice(0, 500)
            );
            throw e;
          }
        }
        // fallback: extrair primeiro objecto/array JSON do body (remove scripts/html debug)
        const m = text.match(/(\{[\s\S]*\}|\[[\s\S]*\])/);
        if (m) {
          try {
            return JSON.parse(m[1]);
          } catch (e) {
            console.error(
              "Falha ao parsear JSON extraído:",
              e,
              m[1].slice(0, 500)
            );
            throw e;
          }
        }
        console.error(
          "Resposta não-JSON recebida de",
          url,
          "->",
          text.slice(0, 500)
        );
        throw new SyntaxError("Response is not JSON");
      }

      document
        .getElementById("login-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const form = e.target;
          const username = form.user.value.trim();
          const password = form.pwd.value;
          if (!username || !password) return;
          try {
            const data = await safeFetchJson(form.action, {
              method: "POST",
              credentials: "include",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams({
                user: username,
                pwd: password,
              }).toString(),
            });
            window.location.href = "./index.html";
          } catch (err) {
            document.getElementById("login-error").textContent =
              "Erro no login: ";
          }
        });
    </script>
